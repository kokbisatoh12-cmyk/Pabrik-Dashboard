<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pabrik Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8edf1;--panel:#f7f9fa;--ink:#14212b;--mute:#5d6d79;--line:#cdd6dd;
  --yellow:#f2b705;--steel:#2f6f8f;--ok:#2e9e5b;--bad:#d64545;--warn:#c98a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171d;--panel:#182129;--ink:#e6edf2;--mute:#8fa1ad;--line:#2a3742;--steel:#5aa6c8}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px}
h1,h2{font-family:"Barlow Condensed",sans-serif;margin:0;letter-spacing:.02em}
button,input{font:inherit}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--yellow);padding:28px;width:min(360px,100%)}
#login h1{font-size:30px;margin-bottom:6px}
#login p{color:var(--mute);margin:0 0 16px}
input[type=password]{width:100%;padding:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px}
.btn{background:var(--ink);color:var(--bg);border:0;padding:11px 16px;cursor:pointer;font-weight:600;width:100%}
#err{color:var(--bad);min-height:20px;margin:8px 0 0}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:3px solid var(--yellow);background:var(--panel)}
header h1{font-size:26px;flex:1}
#conn{color:var(--mute);font-size:13px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.totals div{background:var(--panel);padding:10px 16px}
.totals b{display:block;font-family:"Barlow Condensed";font-size:26px}
.totals span{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 140px)}
#list{border-right:1px solid var(--line);background:var(--panel)}
.bot{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.bot:hover{background:var(--bg)}
.bot.sel{background:var(--bg);box-shadow:inset 4px 0 var(--yellow)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mute)}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}.dot.stale{background:var(--warn)}
.bot small{display:block;color:var(--mute)}
#detail{padding:18px;display:grid;gap:16px;align-content:start}
.sec{background:var(--panel);border:1px solid var(--line);padding:14px}
.sec h2{font-size:20px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.stats b{display:block;font-size:20px;font-weight:600}
.stats span{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
canvas{width:100%;display:block;background:var(--bg);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500}
td.n{text-align:right}
.invbox{max-height:320px;overflow:auto}
#logs{margin:0;padding:0;list-style:none;max-height:320px;overflow:auto}
#logs li{padding:4px 0;border-bottom:1px solid var(--line)}
.phase{display:inline-block;background:var(--yellow);color:#14212b;padding:2px 9px;font-weight:600}
.empty{padding:40px;color:var(--mute)}
@media(max-width:800px){main{grid-template-columns:1fr}#list{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}.bot{width:auto;border-bottom:0;white-space:nowrap}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="login">
  <form id="lf">
    <h1>Pabrik Monitor</h1>
    <p>Masukkan password dashboard.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="btn">Masuk</button>
    <div id="err"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header><h1>Pabrik Monitor</h1><span id="conn"></span><button id="out" class="btn" style="width:auto;padding:7px 12px">Keluar</button></header>
  <div class="totals" id="totals"></div>
  <main>
    <nav id="list"></nav>
    <div id="detail"></div>
  </main>
</section>

<script>
const $ = (s) => document.querySelector(s);
const STALE = 45000;
let key = localStorage.getItem("pabrikKey") || "";
let sel = localStorage.getItem("pabrikSel") || "";
let timer = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("id-ID");
const dur = (s) => { s = Math.max(0, s | 0); const h = s / 3600 | 0, m = (s % 3600) / 60 | 0; return h ? `${h}j ${m}m` : `${m}m ${s % 60}d`; };

function state(b, now) {
  if (now - b.ts > STALE) return ["stale", "tidak ada laporan"];
  return b.online ? ["on", "online"] : ["off", b.status || "offline"];
}

async function poll() {
  try {
    const r = await fetch("/api/state", { headers: { "x-view-key": key }, cache: "no-store" });
    if (r.status === 401) return logout("Password salah");
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    render(d);
    $("#conn").textContent = "update " + new Date().toLocaleTimeString("id-ID") + (d.persistent ? "" : " · memori sementara");
  } catch (e) {
    $("#conn").textContent = "gagal ambil data: " + e.message;
  }
}

function render(d) {
  const bots = d.bots;
  if (!bots.some((b) => b.name === sel)) sel = bots[0]?.name || "";
  const sum = (k) => bots.reduce((a, b) => a + (+b[k] || 0), 0);
  const online = bots.filter((b) => b.online && d.now - b.ts <= STALE).length;
  $("#totals").innerHTML = [
    [`${online}/${bots.length}`, "bot online"], [fmt(sum("seeds")), "seed"], [fmt(sum("blocks")), "block"],
    [fmt(sum("planted")), "tertanam"], [fmt(sum("harvested")), "terpanen"], [fmt(sum("gems")), "gems"],
  ].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");

  $("#list").innerHTML = bots.map((b) => {
    const [c, t] = state(b, d.now);
    return `<button class="bot ${b.name === sel ? "sel" : ""}" data-n="${esc(b.name)}"><i class="dot ${c}"></i><span>${esc(b.name)}<small>${esc(b.phase || t)}</small></span></button>`;
  }).join("") || "";
  document.querySelectorAll(".bot").forEach((el) => el.onclick = () => { sel = el.dataset.n; localStorage.setItem("pabrikSel", sel); render(d); });

  const b = bots.find((x) => x.name === sel);
  if (!b) { $("#detail").innerHTML = '<div class="empty">Belum ada bot yang lapor. Jalankan script di Lucifer dan cek dashboardUrl + dashboardKey.</div>'; return; }
  const [c, t] = state(b, d.now);
  const age = Math.round((d.now - b.ts) / 1000);
  $("#detail").innerHTML = `
    <div class="sec">
      <h2>${esc(b.name)} <span class="phase">${esc(b.phase)}</span></h2>
      <div class="stats">
        <div><b>${esc(t)}</b><span>status · laporan ${age}d lalu</span></div>
        <div><b>${esc(b.world || "-")}</b><span>world (${b.players ?? 0} pemain)</span></div>
        <div><b>${b.x}, ${b.y}</b><span>posisi</span></div>
        <div><b>${b.level}</b><span>level</span></div>
        <div><b>${fmt(b.gems)}</b><span>gems</span></div>
        <div><b>${b.ping} ms</b><span>ping</span></div>
        <div><b>${fmt(b.seeds)}</b><span>seed</span></div>
        <div><b>${fmt(b.blocks)}</b><span>block</span></div>
        <div><b>${b.planted}/${b.harvested}</b><span>tanam / panen</span></div>
        <div><b>${b.cycles}</b><span>siklus</span></div>
        <div><b>${dur(b.uptime)}</b><span>uptime script</span></div>
        <div><b>${b.slots}</b><span>slot terpakai</span></div>
      </div>
    </div>
    <div class="two">
      <div class="sec"><h2>Posisi di world</h2><canvas id="map" width="600" height="360"></canvas></div>
      <div class="sec"><h2>Log</h2><ul id="logs">${[...b.logs].reverse().map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>
    </div>
    <div class="sec"><h2>Inventory</h2><div class="invbox"><table><tr><th>Item</th><th>ID</th><th class="n">Jumlah</th></tr>
      ${b.inventory.map((i) => `<tr><td>${esc(i.name)}</td><td>${i.id}</td><td class="n">${fmt(i.count)}</td></tr>`).join("")}</table></div></div>`;
  drawMap(b, c);
}

function drawMap(b, c) {
  const cv = $("#map"), g = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const W = cv.width, H = cv.height, ww = b.ww || 100, wh = b.wh || 60;
  const sx = W / ww, sy = H / wh;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = css.getPropertyValue("--line"); g.lineWidth = 1;
  for (let x = 0; x <= ww; x += 10) { g.beginPath(); g.moveTo(x * sx, 0); g.lineTo(x * sx, H); g.stroke(); }
  for (let y = 0; y <= wh; y += 10) { g.beginPath(); g.moveTo(0, y * sy); g.lineTo(W, y * sy); g.stroke(); }
  const pts = b.trail || [];
  g.strokeStyle = css.getPropertyValue("--steel"); g.lineWidth = 2; g.beginPath();
  pts.forEach((p, i) => { const X = (p.x + .5) * sx, Y = (p.y + .5) * sy; i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
  g.stroke();
  const X = (b.x + .5) * sx, Y = (b.y + .5) * sy;
  g.fillStyle = c === "on" ? css.getPropertyValue("--yellow") : css.getPropertyValue("--bad");
  g.strokeStyle = "#14212b"; g.lineWidth = 2;
  g.beginPath(); g.arc(X, Y, 7, 0, 7); g.fill(); g.stroke();
}

function start() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  poll(); clearInterval(timer); timer = setInterval(poll, 3000);
}
function logout(msg) {
  clearInterval(timer); localStorage.removeItem("pabrikKey"); key = "";
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#err").textContent = msg || "";
}
$("#lf").onsubmit = (e) => { e.preventDefault(); key = $("#pw").value; localStorage.setItem("pabrikKey", key); start(); };
$("#out").onclick = () => logout();
if (key) start();
</script>
</body>
</html>
